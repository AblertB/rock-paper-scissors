<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4ef">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <p class="eyebrow">A classic game</p>
      <h1>Rock <span class="title-accent">Paper</span> Scissors</h1>
      <p class="intro">Make your move. Can you beat the computer?</p>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="score">
        <span class="score-label">YOU</span>
        <span class="score-value" id="player-score">0</span>
      </div>
      <span class="score-divider" aria-hidden="true">:</span>
      <div class="score">
        <span class="score-label">COMPUTER</span>
        <span class="score-value" id="computer-score">0</span>
      </div>
    </section>

    <section class="play-area" aria-labelledby="round-heading">
      <h2 id="round-heading">Choose your move</h2>
      <div class="choices">
        <button class="choice" type="button" data-choice="rock" aria-label="Choose rock">
          <span class="choice-icon" aria-hidden="true">✊</span>
          <span class="choice-name">Rock</span>
        </button>
        <button class="choice" type="button" data-choice="paper" aria-label="Choose paper">
          <span class="choice-icon" aria-hidden="true">✋</span>
          <span class="choice-name">Paper</span>
        </button>
        <button class="choice" type="button" data-choice="scissors" aria-label="Choose scissors">
          <span class="choice-icon" aria-hidden="true">✌️</span>
          <span class="choice-name">Scissors</span>
        </button>
      </div>

      <div class="round-result" id="round-result" aria-live="polite" aria-atomic="true">
        Pick a hand to play your first round.
      </div>
    </section>

    <button class="reset-button" id="reset-button" type="button">Reset score</button>
    <footer>First to have fun wins.</footer>
  </main>
</body>
</html>
